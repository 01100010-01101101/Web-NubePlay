<main class="login-contenido">

    <div class="container">

        <div class="row justify-content-center align-items-center">

            <div class="col-md-7 col-lg-5">

                <div class="auth-card">




                    <div class="login-logo">


                        <div class="logo-placeholder">

                            <i class="bi bi-cloud-fill"></i>

                        </div>

                    </div>


                    <h1>
                        Iniciar sesión
                    </h1>


                    <p class="auth-subtitle">
                        Ingresa a tu cuenta NUBEPLAY
                    </p>


                    <div
                        id="mensajeLogin"
                        class="alert d-none"
                        role="alert"
                    >
                    </div>


                    <form id="formLogin">


                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Correo electrónico
                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>


                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="correo@ejemplo.com"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Contraseña
                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Ingresa tu contraseña"
                                    required
                                >

                            </div>

                        </div>


                        <div class="login-opciones">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="recordarme"
                                >

                                <label
                                    class="form-check-label"
                                    for="recordarme"
                                >
                                    Recordarme
                                </label>

                            </div>


                            <a
                                href="#"
                                class="auth-link"
                            >
                                ¿Olvidaste tu contraseña?
                            </a>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-nubeplay w-100 login-boton"
                        >

                            <i class="bi bi-box-arrow-in-right"></i>

                            Iniciar sesión

                        </button>


                    </form>

                    <div class="auth-footer">

                        <p>
                            ¿No tienes una cuenta?
                        </p>


                        <a
                            href="registro.html"
                            class="btn btn-outline-primary"
                        >
                            Crear cuenta
                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</main>
