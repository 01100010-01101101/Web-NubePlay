<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos | NUBEPLAY</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    

    <link rel="stylesheet" href="../assets/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-nubeplay">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-cloud-fill"></i> NUBEPLAY
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link btn btn-outline-light px-3 text-white" href="carrito.html">
                            <i class="bi bi-cart3 me-1"></i> Carrito 
                            <span id="contadorCarrito" class="badge bg-primary ms-1">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white py-5 text-center mb-4">
        <div class="container">
            <h1 class="fw-bold display-4"><i class="bi bi-controller me-2"></i>Catálogo de Productos</h1>
            <p class="lead mb-0">Encuentra los mejores juegos, consolas y accesorios al mejor precio.</p>
        </div>
    </header>

    <main class="container my-4 flex-grow-1">
        <div id="alertaCarrito" class="alert alert-success alert-dismissible fade show d-none position-fixed bottom-0 end-0 m-4 shadow-lg" style="z-index: 1050;" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span id="mensajeAlerta">Producto agregado al carrito.</span>
        </div>

        <div class="row mb-4 g-3">
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar producto por nombre...">
                </div>
            </div>
            <div class="col-md-4">
                <select id="selectCategoria" class="form-select">
                    <option value="todas">Todas las categorías</option>
                    <option value="juegos">Videojuegos</option>
                    <option value="consolas">Consolas</option>
                    <option value="accesorios">Accesorios</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="contenedorProductos">

        </div>
    </main>

    <footer class="footer-nubeplay py-4 text-center mt-auto bg-dark text-white">
        <div class="container">
            <p class="mb-0">© 2026 NUBEPLAY. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/productos.js"></script>
</body>

</html>
